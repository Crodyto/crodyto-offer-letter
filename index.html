<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crodyto HR | Secure Access</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="background"></div>

    <main class="lock-container">

        <div class="logo-box">
            <img src="./logo.png" alt="Crodyto Logo">
        </div>

        <h1>Crodyto HR System</h1>

        <p class="subtitle">
            Secure access to the Offer Letter Generator
        </p>

        <form id="lockForm">

            <label for="password">Enter Password</label>

            <div class="input-box">
                <span>🔐</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="off"
                >
            </div>

            <button type="submit">
                Unlock & Continue
            </button>

        </form>

        <p id="error"></p>

        <div class="footer">
            Authorized access only
            <br>
            © 2026 Crodyto. All rights reserved.
        </div>

    </main>

    <script src="./script.js"></script>

</body>
</html>
